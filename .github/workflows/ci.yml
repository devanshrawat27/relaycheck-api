name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaycheck
          POSTGRES_PASSWORD: relaycheck
          POSTGRES_DB: relaycheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaycheck -d relaycheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://relaycheck:relaycheck@localhost:5432/relaycheck
      AMQP_URL: amqp://guest:guest@localhost:5672
      INTERNAL_API_TOKEN: ci-internal-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type check (if present)
        run: npm run type-check --if-present

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Test (if present)
        run: npm run test --if-present

      - name: Build (if present)
        run: npm run build --if-present
