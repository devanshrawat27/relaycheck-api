# Render blueprint for the RelayCheck Control API.
#
# This covers the Control API + a managed Postgres. RabbitMQ, Mailpit, the demo
# receiver, the runner, and the dashboard are deployed together on a single host
# via infra/docker-compose.prod.yml (see docs/DEPLOYMENT.md), because Render has
# no first-class RabbitMQ blueprint type and the runner/receiver are private
# sidecar processes. Deploying this blueprint only needs a Render account.

services:
  - type: web
    name: relaycheck-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3200
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: APP_URL
        value: https://YOUR_DASHBOARD_DOMAIN
      - key: EMAIL_FROM
        value: RelayCheck <no-reply@YOUR_DOMAIN>
      - key: DATABASE_URL
        fromDatabase:
          name: relaycheck-db
          property: connectionString
      - key: AMQP_URL
        value: amqp://guest:guest@YOUR_RABBITMQ_HOST:5672

  - type: pserv
    name: relaycheck-db
    runtime: image
    plan: starter
    image:
      image: postgres:16-alpine
    envVars:
      - key: POSTGRES_USER
        value: relaycheck
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: relaycheck
